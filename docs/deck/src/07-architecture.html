<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="deck.css">
<style>
  body { background: var(--night); }
  .diagram { margin-top: 22px; position: relative; width: 1696px; height: 700px; }
  svg { width: 1696px; height: 700px; overflow: visible; }
  .lbl { font-family: "Inter", sans-serif; font-size: 22px; fill: #E8EDF2; font-weight: 600; }

  .zone.cpu { fill: #8A97A6; }
  .box { fill: #171E25; stroke: #2A333C; stroke-width: 1.5; }

  .box.out { stroke: #E8632B; stroke-opacity: .8; }

  .flow.warm { stroke: #E8632B; stroke-opacity: .8; }

  .legend i { display: inline-block; width: 34px; height: 3px; margin-right: 10px; vertical-align: middle; border-radius: 2px; }

<body class="night"><div class="slide">
  <div class="kicker">How it works</div>
  <h2 style="font-size: 56px">Six models on the Hexagon NPU. Capture, validation and input injection on the CPU. <em>The GPU untouched.</em></h2>
  <div class="diagram">
  <svg viewBox="0 0 1696 700">
    <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4550"/></marker>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2FBF8F" fill-opacity=".8"/></marker>
          <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E8632B" fill-opacity=".9"/></marker></defs>

    <!-- zones -->
    <text x="0" y="28" class="zone cpu">SENSES · CPU</text>
    <rect x="440" y="0" width="560" height="600" rx="26" fill="#2FBF8F" fill-opacity=".05" stroke="#2FBF8F" stroke-opacity=".25" stroke-dasharray="0"/>
    <text x="470" y="38" class="zone">HEXAGON NPU · 80 TOPS ON X2, 45 ON X ELITE</text>
    <text x="1080" y="28" class="zone cpu">ACTS · CPU</text>
    <text x="1460" y="28" class="zone cpu">WINDOWS</text>

    <!-- senses -->
    <g><rect x="0" y="70" width="330" height="88" rx="16" class="box"/><text x="24" y="106" class="lbl">Webcam</text><text x="24" y="136" class="sub">1280×720 · 28 fps</text></g>
    <g><rect x="0" y="200" width="330" height="88" rx="16" class="box"/><text x="24" y="236" class="lbl">Microphone</text><text x="24" y="266" class="sub">16 kHz · voice activity detection</text></g>
    <g><rect x="0" y="330" width="330" height="88" rx="16" class="box"/><text x="24" y="366" class="lbl">Screen</text><text x="24" y="396" class="sub">UI Automation tree + screenshot</text></g>
    <g><rect x="0" y="460" width="330" height="88" rx="16" class="box"/><text x="24" y="496" class="lbl">Arduino switches</text><text x="24" y="526" class="sub">JSON over USB serial · optional</text></g>

    <!-- NPU models -->
    <g><rect x="470" y="70" width="500" height="96" rx="16" class="box npu"/><text x="494" y="106" class="lbl">Face detector + 468-point mesh</text><text x="494" y="138" class="sub">head pose · blink · mouth</text><text x="860" y="138" class="ms">0.6 ms</text></g>
    <g><rect x="470" y="190" width="500" height="96" rx="16" class="box npu"/><text x="494" y="226" class="lbl">Whisper base</text><text x="494" y="258" class="sub">English + Hindi · encoder + decoder</text><text x="860" y="258" class="ms">79 ms</text></g>
    <g><rect x="470" y="310" width="500" height="96" rx="16" class="box npu"/><text x="494" y="346" class="lbl">Qwen3-4B-Instruct</text><text x="494" y="378" class="sub">screen list + speech → JSON tool calls</text><text x="836" y="378" class="ms">31 tok/s</text></g>
    <g><rect x="470" y="430" width="500" height="96" rx="16" class="box npu"/><text x="494" y="466" class="lbl">Qwen3-VL-4B-Instruct</text><text x="494" y="498" class="sub">describes the screen and the camera</text><text x="836" y="498" class="ms">25 tok/s</text></g>
    <text x="470" y="590" class="sub">Qualcomm AI Hub models · ONNX Runtime QNN (HTP) · GenieX (QAIRT) · every op profiled on the NPU</text>

    <!-- acts -->
    <g><rect x="1080" y="70" width="330" height="96" rx="16" class="box"/><text x="1104" y="106" class="lbl">Head cursor + gestures</text><text x="1104" y="138" class="sub">joystick · dwell ring · blink · drag</text></g>
    <g><rect x="1080" y="190" width="330" height="96" rx="16" class="box"/><text x="1104" y="226" class="lbl">Fast grammar</text><text x="1104" y="258" class="sub">25 commands · under 1 ms</text></g>

  <div class="legend"><span><i style="background:#2FBF8F"></i>neural network, runs on the NPU</span><span><i style="background:#3A4550"></i>plain code, CPU</span><span><i style="background:#E8632B"></i>effect on Windows</span><span>GPU: untouched, left to the user's apps</span></div>
